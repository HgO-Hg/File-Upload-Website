<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>站主管理 · 文件中转站</title>
    <style>
        :root {
            --blue: #0267f4;
            --pink: #ff69b4;
            --dark: #1a1a2e;
            --panel: rgba(10, 25, 41, 0.86);
            --line: rgba(127, 191, 255, 0.28);
            --text: #eaf4ff;
            --muted: #9db8d6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--dark) 0%, #0a1929 100%);
            padding: 22px 16px 40px;
        }
        .wrap { max-width: 1180px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: 1px; }
        h1 span { color: var(--pink); }
        .sub { color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
        }
        .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        input[type=password], input[type=text], select {
            padding: 9px 12px;
            border-radius: 9px;
            border: 1px solid var(--line);
            background: rgba(6, 18, 32, 0.95);
            color: var(--text);
            font-size: .95rem;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--blue); }
        button {
            padding: 9px 16px;
            border-radius: 9px;
            border: 1px solid var(--line);
            background: rgba(2, 103, 244, 0.16);
            color: var(--text);
            font-size: .95rem;
            cursor: pointer;
        }
        button:hover:not(:disabled) { border-color: var(--blue); background: rgba(2, 103, 244, 0.3); }
        button:disabled { opacity: .5; cursor: not-allowed; }
        button.primary { background: linear-gradient(135deg, var(--blue), #0a86ff); border-color: transparent; font-weight: 600; }
        button.danger { background: rgba(255, 80, 110, 0.18); border-color: rgba(255, 80, 110, .5); }
        button.danger:hover:not(:disabled) { background: rgba(255, 80, 110, 0.32); }
        .hidden { display: none !important; }
        .msg { margin-top: 10px; font-size: .9rem; min-height: 1.2em; }
        .msg.err { color: #ff8fa3; }
        .msg.ok { color: #7ee2a8; }

        table { width: 100%; border-collapse: collapse; font-size: .9rem; }
        th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid rgba(127, 191, 255, 0.14); vertical-align: middle; }
        th { color: var(--muted); font-weight: 600; white-space: nowrap; }
        tbody tr:hover { background: rgba(2, 103, 244, 0.08); }
        td.name { max-width: 320px; word-break: break-all; }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: .78rem;
            border: 1px solid var(--line);
            color: var(--muted);
            white-space: nowrap;
        }
        .tag.expired { border-color: rgba(255, 80, 110, .55); color: #ff8fa3; }
        .mono { font-variant-numeric: tabular-nums; }
        .muted { color: var(--muted); }
        .toolbar-gap { flex: 1 1 auto; }
        .empty { padding: 28px 8px; text-align: center; color: var(--muted); }
        a.dl { color: #9ee7ff; text-decoration: none; }
        a.dl:hover { text-decoration: underline; }
        .foot { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 24px; }

        /* ---- 选择框与批量操作 ---- */
        .chkbox { width: 18px; height: 18px; accent-color: #0a86ff; cursor: pointer; flex: 0 0 auto; }
        .batch-bar {
            margin-bottom: 12px;
            padding-top: 12px;
            border-top: 1px dashed rgba(127, 191, 255, 0.18);
        }
        .batch-bar .count { font-variant-numeric: tabular-nums; }
        .chk-label { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
        td.col-check, th.col-check { width: 36px; text-align: center; padding-left: 4px; padding-right: 0; }

        /* ---- 手机端：表格变卡片，按钮变大更好点 ---- */
        @media (max-width: 760px) {
            body { padding: 14px 10px 32px; }
            h1 { font-size: 1.25rem; }
            .sub { font-size: .85rem; margin-bottom: 14px; }
            .card { padding: 13px; border-radius: 12px; }
            .row { gap: 8px; }
            input[type=text], input[type=password], select, button { font-size: 1rem; padding: 10px 12px; }
            .toolbar-gap { display: none; }
            #stat { flex: 1 1 100%; order: 9; font-size: .82rem; }
            .batch-bar { gap: 8px; }
            .batch-bar .count { flex: 1 1 auto; }

            table, thead, tbody, tr, th, td { display: block; width: 100%; }
            thead { display: none; }
            tbody tr {
                position: relative;
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 10px 12px;
                margin-bottom: 10px;
                background: rgba(6, 18, 32, 0.55);
            }
            tbody tr:hover { background: rgba(6, 18, 32, 0.55); }
            td { border: 0; padding: 3px 0; display: flex; gap: 8px; align-items: baseline; }
            td::before {
                content: attr(data-label);
                color: var(--muted);
                font-size: .8rem;
                min-width: 58px;
                flex: 0 0 auto;
            }
            td.col-check { position: absolute; top: 10px; right: 10px; padding: 0; width: auto; }
            td.col-check::before { content: none; }
            td.name { max-width: none; font-size: 1rem; font-weight: 600; padding-right: 30px; }
            td.td-actions { margin-top: 8px; }
            td.td-actions::before { content: none; }
            td.td-actions button { padding: 8px 14px; font-size: .95rem; }
            a.dl {
                display: inline-block;
                padding: 8px 14px;
                border: 1px solid rgba(158, 231, 255, 0.4);
                border-radius: 8px;
            }
            .hide-sm { display: none !important; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>站主管理 <span>✦</span></h1>
    <div class="sub">仅站主可用：查看、下载、删除所有分区里的文件。</div>

    <!-- ============ 登录 ============ -->
    <div class="card" id="loginCard">
        <div class="row">
            <input type="password" id="pwd" placeholder="请输入站主密码" autocomplete="current-password" style="flex:1 1 260px">
            <button class="primary" id="loginBtn">登录</button>
        </div>
        <div class="msg" id="loginMsg"></div>
    </div>

    <!-- ============ 管理台 ============ -->
    <div class="card hidden" id="panel">
        <div class="row" style="margin-bottom:10px">
            <label class="muted">分区
                <select id="roomSel" style="margin-left:6px">
                    <option value="all" selected>全部</option>
                </select>
            </label>
            <input type="text" id="kw" placeholder="按文件名搜索" style="flex:1 1 160px">
            <button id="refreshBtn">刷新</button>
            <span class="toolbar-gap"></span>
            <span class="muted" id="stat"></span>
            <button id="logoutBtn" class="danger">退出</button>
        </div>

        <div class="row batch-bar">
            <label class="muted chk-label"><input type="checkbox" class="chkbox" id="checkAll"> 全选本页</label>
            <span class="muted count" id="selInfo">已选 0 项</span>
            <button id="batchDelBtn" class="danger" disabled>批量删除</button>
            <button id="purgeBtn">一键清理过期</button>
        </div>

        <div id="tableBox"></div>

        <div class="row" style="margin-top:14px">
            <button id="prevBtn">← 上一页</button>
            <button id="nextBtn">下一页 →</button>
            <span class="toolbar-gap"></span>
            <span class="muted" id="pageInfo"></span>
        </div>
        <div class="msg" id="panelMsg"></div>
    </div>

    <div class="foot">文件中转站 · 站主控制台</div>
</div>

<script>
/* =====================================================================
   站主管理页
   ---------------------------------------------------------------------
   ⚠ 安全要点（改这个文件时务必遵守）：
     1. 页面里**绝不**出现站主密码。密码只在登录时 POST 给 /api/admin/login，
        由服务端比对；服务端返回一个短期 HMAC 令牌。
     2. 令牌存 sessionStorage（关掉标签页即失效），不放 localStorage。
     3. 文件名来自用户上传，渲染时必须转义，否则可被注入 HTML/脚本。
     4. 下载链接只允许 http/https。
   ===================================================================== */

/* 部署前由 prepare-deploy.js 填入后端地址（与主页面同一套机制）。
   留空 = 同源（管理页与接口同站点时可直接用）。 */
const API_BASE = "https://file.hgo-hg.com";

// 本地联调：只允许 localhost，避免把令牌发到任意远端。
// （保留它是安全的：即便在生产页面上传 ?api=，也只会指向使用者自己的本机。）
(function () {
    try {
        const q = new URLSearchParams(location.search).get('api');
        if (q && /^https?:\/\/(127\.0\.0\.1|localhost|0\.0\.0\.0|\[::1\])(:\d{1,5})?(\/|$)/i.test(q)) {
            window.__API_OVERRIDE__ = new URL(q).origin;
        }
    } catch (e) { /* ignore */ }
})();
const EFFECTIVE_API = (window.__API_OVERRIDE__ || API_BASE || '');
const api = (p) => EFFECTIVE_API + p;

const TOKEN_KEY = 'relay-admin-token';
const PAGE_SIZE = 100;

let token = '';
let offset = 0;
let lastTotal = 0;
let lastFiles = [];
let busy = false;
/** 当前选中的文件 id（只保留当前页/当前筛选里存在的，见 render()） */
const selected = new Set();

const $ = (id) => document.getElementById(id);

/** HTML 转义：文件名等用户数据一律走这里 */
function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/** 只接受 http/https 的链接；其余返回空串 */
function safeUrl(u) {
    const raw = String(u || '').trim();
    if (!raw || !/^https?:\/\//i.test(raw)) return '';
    return raw;
}

function humanSize(n) {
    const v = Number(n) || 0;
    if (v < 1024) return v + ' B';
    const u = ['KB', 'MB', 'GB', 'TB'];
    let x = v, i = -1;
    do { x /= 1024; i++; } while (x >= 1024 && i < u.length - 1);
    return x.toFixed(1) + ' ' + u[i];
}

function fmtTime(ms) {
    if (!ms) return '—';
    const d = new Date(Number(ms));
    if (isNaN(d.getTime())) return '—';
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function remainText(sec) {
    const s = Number(sec) || 0;
    if (s <= 0) return '已过期';
    if (s < 60) return s + ' 秒';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时';
    return Math.floor(s / 86400) + ' 天';
}

function setMsg(el, text, cls) {
    el.textContent = text || '';
    el.className = 'msg' + (cls ? ' ' + cls : '');
}

/**
 * 带重试的请求：只重试"网络层失败"和 5xx。
 * 4xx 是服务端明确回应（密码错、未登录等），重试没有意义还会拖慢反馈。
 */
async function fetchRetry(url, opts, attempts) {
    const n = attempts || 3;
    let lastErr = null;
    for (let i = 1; i <= n; i++) {
        try {
            const res = await fetch(url, opts);
            if (res.ok || res.status < 500) return res;
            lastErr = new Error('HTTP ' + res.status);
        } catch (e) {
            lastErr = e;
        }
        if (i < n) await new Promise(r => setTimeout(r, i === 1 ? 600 : 1500));
    }
    throw lastErr || new Error('无法连接服务');
}

/* ---------- 登录 ---------- */
async function login() {
    const pwd = $('pwd').value;
    if (!pwd) { setMsg($('loginMsg'), '请输入密码', 'err'); return; }
    $('loginBtn').disabled = true;
    setMsg($('loginMsg'), '验证中…');
    try {
        const res = await fetchRetry(api('/api/admin/login'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pwd })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok || !data.token) {
            setMsg($('loginMsg'), data.error || ('登录失败（HTTP ' + res.status + '）'), 'err');
            return;
        }
        token = data.token;
        try { sessionStorage.setItem(TOKEN_KEY, token); } catch (e) { /* 隐私模式可能禁用存储 */ }
        $('pwd').value = '';
        setMsg($('loginMsg'), '');
        enterPanel(data.rooms);
        await loadFiles(0);
    } catch (err) {
        setMsg($('loginMsg'), '无法连接服务：' + (err && err.message ? err.message : String(err)), 'err');
    } finally {
        $('loginBtn').disabled = false;
    }
}

function enterPanel(rooms) {
    $('loginCard').classList.add('hidden');
    $('panel').classList.remove('hidden');
    const sel = $('roomSel');
    const cur = sel.value;
    if (Array.isArray(rooms) && rooms.length) {
        sel.textContent = '';
        const all = document.createElement('option');
        all.value = 'all';
        all.textContent = '全部';
        sel.appendChild(all);
        rooms.forEach(function (r) {
            const o = document.createElement('option');
            o.value = String(r.key);
            o.textContent = String(r.label || r.key);
            sel.appendChild(o);
        });
        sel.value = rooms.some(r => String(r.key) === cur) ? cur : 'all';
    }
}

function logout() {
    token = '';
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { }
    $('panel').classList.add('hidden');
    $('loginCard').classList.remove('hidden');
    setMsg($('loginMsg'), '已退出', 'ok');
}

/* ---------- 拉取列表 ---------- */
async function loadFiles(newOffset) {
    if (!token || busy) return;
    busy = true;
    $('refreshBtn').disabled = true;
    setMsg($('panelMsg'), '加载中…');
    try {
        const room = $('roomSel').value || 'all';
        const url = api('/api/admin/files?room=' + encodeURIComponent(room)
            + '&limit=' + PAGE_SIZE + '&offset=' + (newOffset || 0));
        const res = await fetchRetry(url, { headers: { Authorization: 'Bearer ' + token } });

        if (res.status === 401) {
            setMsg($('panelMsg'), '登录已失效，请重新登录', 'err');
            logout();
            return;
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
            setMsg($('panelMsg'), data.error || ('加载失败（HTTP ' + res.status + '）'), 'err');
            return;
        }
        offset = Number(data.offset) || 0;
        lastTotal = Number(data.total) || 0;
        lastFiles = Array.isArray(data.files) ? data.files : [];
        if (Array.isArray(data.rooms)) enterPanel(data.rooms);
        render();
        setMsg($('panelMsg'), '');
    } catch (err) {
        setMsg($('panelMsg'), '无法连接服务：' + (err && err.message ? err.message : String(err)), 'err');
    } finally {
        busy = false;
        $('refreshBtn').disabled = false;
    }
}

/* ---------- 渲染 ---------- */
/** 当前页 + 当前搜索词过滤后的行（批量操作只作用于这些可见行） */
function visibleRows() {
    const kw = $('kw').value.trim().toLowerCase();
    return kw ? lastFiles.filter(f => String(f.name || '').toLowerCase().includes(kw)) : lastFiles;
}

function render() {
    const rows = visibleRows();
    const bytes = rows.reduce((s, f) => s + (Number(f.size) || 0), 0);
    $('stat').textContent = '共 ' + lastTotal + ' 个文件 · 本页 ' + rows.length + ' 个（' + humanSize(bytes) + '）';

    // 只保留当前可见行里的选中项：翻页/换分区/搜索后不残留"看不见的选中"
    const alive = new Set(rows.map(f => f.id));
    for (const id of Array.from(selected)) { if (!alive.has(id)) selected.delete(id); }

    const box = $('tableBox');
    if (!rows.length) {
        box.innerHTML = '<div class="empty">' + ($('kw').value.trim() ? '没有匹配的文件' : '这个分区还没有文件') + '</div>';
    } else {
        const trs = rows.map(function (f) {
            const url = safeUrl(f.url);
            const expired = Boolean(f.expired);
            // ⚠ 永久文件的 expiresAt 是 0，剩余秒数也是 0；如果直接走 remainText(0)
            //   会被显示成"已过期"（误导）。这里单独判断成"永久"。
            const forever = !expired && (!f.expiresAt || Number(f.expiresIn) === 0);
            const checked = selected.has(f.id) ? ' checked' : '';
            return '<tr>'
                + '<td class="col-check"><input type="checkbox" class="chkbox row-check" data-id="'
                + esc(f.id) + '"' + checked + '></td>'
                + '<td data-label="分区"><span class="tag">' + esc(f.room || '—') + '</span></td>'
                + '<td class="name" data-label="文件名">' + esc(f.name || '(未命名)') + '</td>'
                + '<td class="mono" data-label="大小">' + humanSize(f.size) + '</td>'
                + '<td class="mono hide-sm" data-label="上传时间">' + esc(fmtTime(f.uploadedAt)) + '</td>'
                + '<td data-label="剩余"><span class="tag' + (expired ? ' expired' : '') + '">'
                + (expired ? '已过期' : (forever ? '永久' : esc(remainText(f.expiresIn)))) + '</span></td>'
                + '<td class="td-actions">'
                + (url ? '<a class="dl" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">下载</a>' : '<span class="muted">—</span>')
                + ' <button class="danger" data-del="' + esc(f.id) + '" data-name="' + esc(f.name || '')
                + '" style="padding:4px 10px;font-size:.82rem">删除</button>'
                + '</td>'
                + '</tr>';
        });
        box.innerHTML = '<table><thead><tr>'
            + '<th class="col-check"></th><th>分区</th><th>文件名</th><th>大小</th>'
            + '<th class="hide-sm">上传时间</th><th>剩余</th><th>操作</th>'
            + '</tr></thead><tbody>' + trs.join('') + '</tbody></table>';

        // 事件用委托绑定，避免文件名里的特殊字符破坏内联事件
        box.querySelectorAll('button[data-del]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                deleteFile(btn.getAttribute('data-del'), btn.getAttribute('data-name'));
            });
        });
        box.querySelectorAll('.row-check').forEach(function (cb) {
            cb.addEventListener('change', function () {
                const id = cb.getAttribute('data-id');
                if (cb.checked) selected.add(id); else selected.delete(id);
                syncSelectionUI();
            });
        });
    }

    syncSelectionUI();

    const pageNo = Math.floor(offset / PAGE_SIZE) + 1;
    const pages = Math.max(1, Math.ceil(lastTotal / PAGE_SIZE));
    $('pageInfo').textContent = '第 ' + pageNo + ' / ' + pages + ' 页';
    $('prevBtn').disabled = offset <= 0;
    $('nextBtn').disabled = offset + PAGE_SIZE >= lastTotal;
}

/** 同步"已选 N 项"、批量按钮可用状态、全选框的三态 */
function syncSelectionUI() {
    const rows = visibleRows();
    const n = selected.size;
    $('selInfo').textContent = '已选 ' + n + ' 项';
    $('batchDelBtn').disabled = n === 0 || busy;
    const all = $('checkAll');
    all.checked = rows.length > 0 && rows.every(f => selected.has(f.id));
    all.indeterminate = n > 0 && !all.checked;
}

/* ---------- 删除 ---------- */
async function deleteFile(id, name) {
    if (!id || busy) return;
    if (!confirm('确定删除这份文件吗？\n\n' + (name || id) + '\n\n删除后下载链接立即失效，且无法恢复。')) return;
    busy = true;
    let deleted = false;
    setMsg($('panelMsg'), '正在删除…');
    try {
        const res = await fetch(api('/api/admin/delete'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ id: id })
        });
        if (res.status === 401) { setMsg($('panelMsg'), '登录已失效，请重新登录', 'err'); logout(); return; }
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
            setMsg($('panelMsg'), data.error || ('删除失败（HTTP ' + res.status + '）'), 'err');
            return;
        }
        setMsg($('panelMsg'), '已删除：' + (data.name || id), 'ok');
        selected.delete(id);
        deleted = true;
    } catch (err) {
        setMsg($('panelMsg'), '删除失败：' + (err && err.message ? err.message : String(err)), 'err');
    } finally {
        busy = false;
    }
    // ⚠ 刷新必须放在 finally 之后：loadFiles() 开头有 `if (busy) return`，
    //   之前在这里直接 await loadFiles() 时 busy 还是 true，刷新被静默跳过，
    //   表现为"删掉了但表格里还在"（浏览器测试抓到的真实 bug）。
    if (deleted) await loadFiles(offset);
}

/* ---------- 批量删除 ---------- */
/**
 * 逐个删除（兼容模式）。
 * 当后端还没有 /api/admin/delete-batch 时（例如函数尚未重新部署）自动退回这条路径，
 * 这样界面不会因为"服务端版本旧"而整块失效。
 */
async function deleteSelectedFallback(ids) {
    let ok = 0, bad = 0;
    for (let i = 0; i < ids.length; i++) {
        setMsg($('panelMsg'), '正在删除 ' + (i + 1) + ' / ' + ids.length + '…');
        try {
            const r = await fetch(api('/api/admin/delete'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                body: JSON.stringify({ id: ids[i] })
            });
            if (r.ok) ok++; else bad++;
        } catch (e) { bad++; }
    }
    return { ok: true, deletedCount: ok, failedCount: bad, compat: true };
}

async function deleteSelected() {
    if (!selected.size || busy) return;
    const ids = Array.from(selected);
    if (!confirm('确定删除选中的 ' + ids.length + ' 个文件吗？\n\n删除后下载链接立即失效，且无法恢复。')) return;
    busy = true;
    let keepMsg = '', keepMsgCls = 'ok';
    setMsg($('panelMsg'), '正在删除 ' + ids.length + ' 个文件…');
    let done = false;
    try {
        let data = null;
        const res = await fetch(api('/api/admin/delete-batch'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ ids: ids })
        });
        if (res.status === 404 || res.status === 405) {
            data = await deleteSelectedFallback(ids);      // 后端版本较旧 → 逐个删
        } else if (res.status === 401) {
            setMsg($('panelMsg'), '登录已失效，请重新登录', 'err'); logout(); return;
        } else {
            data = await res.json().catch(() => ({}));
            if (!res.ok || !data.ok) {
                setMsg($('panelMsg'), data.error || ('批量删除失败（HTTP ' + res.status + '）'), 'err');
                return;
            }
        }
        selected.clear();
        keepMsg = '已删除 ' + data.deletedCount + ' 个' + (data.failedCount ? '，失败 ' + data.failedCount + ' 个' : '')
            + (data.compat ? '（兼容模式）' : '');
        keepMsgCls = data.failedCount ? 'err' : 'ok';
        setMsg($('panelMsg'), keepMsg, keepMsgCls);
        done = true;
    } catch (err) {
        setMsg($('panelMsg'), '批量删除失败：' + (err && err.message ? err.message : String(err)), 'err');
    } finally {
        busy = false;
    }
    if (done) await loadFiles(offset);
    // 刷新列表会清空提示，所以刷新后把结果再写回去，否则用户看不到"清理了多少"
    if (done && keepMsg) setMsg($('panelMsg'), keepMsg, keepMsgCls);
}

/* ---------- 一键清理过期 ---------- */
/**
 * 兼容模式：后端没有 /api/admin/purge-expired 时，由前端扫描全部分页并逐个删除。
 * 判据只用服务端返回的 expired 字段，**绝不**在客户端猜过期时间。
 */
async function purgeExpiredFallback() {
    let all = [], offset = 0;
    for (let guard = 0; guard < 50; guard++) {
        const res = await fetch(api('/api/admin/files?room=all&limit=1000&offset=' + offset),
            { headers: { Authorization: 'Bearer ' + token } });
        if (res.status === 401) { logout(); throw new Error('登录已失效'); }
        if (!res.ok) throw new Error('读取列表失败（HTTP ' + res.status + '）');
        const data = await res.json();
        const files = Array.isArray(data.files) ? data.files : [];
        all = all.concat(files);
        if (!data.truncated || !files.length) break;
        offset += files.length;
    }
    const expired = all.filter(f => f.expired);
    let ok = 0, freed = 0, bad = 0;
    for (let i = 0; i < expired.length; i++) {
        setMsg($('panelMsg'), '正在清理 ' + (i + 1) + ' / ' + expired.length + '…');
        try {
            const r = await fetch(api('/api/admin/delete'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                body: JSON.stringify({ id: expired[i].id })
            });
            if (r.ok) { ok++; freed += Number(expired[i].size) || 0; } else bad++;
        } catch (e) { bad++; }
    }
    return { ok: true, scanned: all.length, deletedCount: ok, freedBytes: freed, failedCount: bad, compat: true };
}

async function purgeExpired() {
    if (busy) return;
    if (!confirm('清理所有分区里已过期的文件？\n\n永久保存的文件不会被删除，此操作不可撤销。')) return;
    busy = true;
    let keepMsg = '', keepMsgCls = 'ok';
    setMsg($('panelMsg'), '正在扫描过期文件…');
    let done = false;
    try {
        let data = null;
        const res = await fetch(api('/api/admin/purge-expired'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({})
        });
        if (res.status === 404 || res.status === 405) {
            data = await purgeExpiredFallback();           // 后端版本较旧 → 前端扫描
        } else if (res.status === 401) {
            setMsg($('panelMsg'), '登录已失效，请重新登录', 'err'); logout(); return;
        } else {
            data = await res.json().catch(() => ({}));
            if (!res.ok || !data.ok) {
                setMsg($('panelMsg'), data.error || ('清理失败（HTTP ' + res.status + '）'), 'err');
                return;
            }
        }
        keepMsg = data.deletedCount
            ? ('已清理 ' + data.deletedCount + ' 个过期文件，释放 ' + humanSize(data.freedBytes) + (data.compat ? '（兼容模式）' : ''))
            : ('没有过期文件（共扫描 ' + data.scanned + ' 个）');
        keepMsgCls = data.failedCount ? 'err' : 'ok';
        setMsg($('panelMsg'), keepMsg, keepMsgCls);
        done = true;
    } catch (err) {
        setMsg($('panelMsg'), '清理失败：' + (err && err.message ? err.message : String(err)), 'err');
    } finally {
        busy = false;
    }
    if (done) await loadFiles(offset);
    if (done && keepMsg) setMsg($('panelMsg'), keepMsg, keepMsgCls);
}

/* ---------- 事件 ---------- */
$('loginBtn').addEventListener('click', login);
$('pwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
$('refreshBtn').addEventListener('click', function () { loadFiles(offset); });
$('logoutBtn').addEventListener('click', logout);
$('roomSel').addEventListener('change', function () {
    selected.clear();                 // 换分区时清空选择，避免误删到别的分区的文件
    loadFiles(0);
});
$('kw').addEventListener('input', function () { render(); });
$('prevBtn').addEventListener('click', function () { loadFiles(Math.max(0, offset - PAGE_SIZE)); });
$('nextBtn').addEventListener('click', function () { loadFiles(offset + PAGE_SIZE); });

// 全选本页（作用于当前筛选后可见的行）
$('checkAll').addEventListener('change', function () {
    const rows = visibleRows();
    if ($('checkAll').checked) rows.forEach(f => selected.add(f.id));
    else rows.forEach(f => selected.delete(f.id));
    render();
});
$('batchDelBtn').addEventListener('click', deleteSelected);
$('purgeBtn').addEventListener('click', purgeExpired);

/* 启动：如果本标签页里已有令牌（刷新页面），直接进入 */
(function boot() {
    try {
        const saved = sessionStorage.getItem(TOKEN_KEY);
        if (saved) {
            token = saved;
            // 先验证令牌是否仍有效：拉一页数据，401 会自动退回登录
            enterPanel(null);
            loadFiles(0);
        }
    } catch (e) { /* 忽略 */ }
})();
</script>
